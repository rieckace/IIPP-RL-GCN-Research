# Floor Plan 1 — Simple 10×10 Office Layout
# Two rooms separated by a corridor, two exits, one fire source.
#
# Visual layout (W = wall, E = exit, F = fire, · = empty):
#
#  ·  ·  ·  ·  ·  ·  ·  ·  ·  E
#  ·  W  W  ·  ·  ·  ·  ·  ·  ·
#  ·  W  ·  ·  ·  ·  ·  ·  ·  ·
#  ·  ·  ·  ·  ·  W  ·  ·  ·  ·
#  ·  ·  W  ·  ·  W  ·  ·  ·  ·
#  ·  ·  F  ·  ·  W  ·  ·  ·  ·
#  ·  ·  ·  W  W  ·  ·  ·  ·  ·
#  ·  ·  ·  ·  ·  ·  ·  W  W  ·
#  ·  ·  ·  ·  ·  W  ·  ·  ·  ·
#  E  ·  ·  ·  ·  ·  ·  ·  ·  ·

grid:
  rows: 10
  cols: 10

map:
  walls:
    - [1, 1]
    - [1, 2]
    - [2, 1]
    - [3, 5]
    - [4, 5]
    - [5, 5]
    - [4, 2]
    - [6, 3]
    - [6, 4]
    - [7, 7]
    - [7, 8]
    - [8, 5]

  exits:
    - [0, 9]
    - [9, 0]

  fire_sources:
    - [5, 2]

  agent_start:
    - [0, 0]

dynamics:
  fire_spread_probability: 0.3
  smoke_radius: 2
  max_steps: 200

rewards:
  exit_reached: 100.0
  fire_hit: -50.0
  smoke_step: -10.0
  wall_bump: -5.0
  normal_step: -1.0
  stay_penalty: -2.0
