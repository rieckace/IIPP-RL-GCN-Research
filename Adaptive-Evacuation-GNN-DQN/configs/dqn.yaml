# DQN Training Configuration for Adaptive Evacuation Environment

environment:
  config_path: "configs/default.yaml"
  grid_rows: 10
  grid_cols: 10

agent:
  gamma: 0.99                    # Discount factor — agent values future rewards highly
  epsilon_start: 1.0             # Start with full random exploration
  epsilon_decay: 0.997           # Slow decay — ~1000 episodes to reach minimum
  epsilon_min: 0.01              # Always keep 1% exploration
  learning_rate: 0.001           # Adam learning rate
  batch_size: 64                 # Mini-batch size for replay sampling
  replay_buffer_size: 50000      # Large buffer for diverse experience
  target_update_freq: 10         # Hard-copy Q→target every N episodes

network:
  hidden_layers: [256, 256, 128] # 3 hidden layers for 800-dim input
  activation: "relu"             # Activation function

training:
  episodes: 1500                 # Total training episodes
  max_steps_per_episode: 200     # Must match environment max_steps
  log_interval: 10               # Print metrics every N episodes
  checkpoint_interval: 100       # Save checkpoint every N episodes
  early_stop_success_rate: 0.90  # Stop early if success rate exceeds this
  early_stop_window: 100         # Window for computing success rate
  seed: 42                       # Random seed for reproducibility

paths:
  checkpoint_dir: "checkpoints/dqn"
  results_dir: "results"
  plots_dir: "results/plots"
  logs_dir: "results/logs"
