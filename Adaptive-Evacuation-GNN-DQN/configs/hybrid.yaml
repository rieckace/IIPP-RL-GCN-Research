# Hybrid GNN-A* Training Configuration

environment:
  config_path: "configs/default.yaml"
  grid_rows: 10
  grid_cols: 10

agent:
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_decay: 0.997
  epsilon_min: 0.01
  learning_rate: 0.001
  batch_size: 64
  replay_buffer_size: 50000
  target_update_freq: 10

network:
  gcn_hidden_dims: [64, 64, 64]
  mlp_hidden_dims: [128, 64]

training:
  episodes: 1500
  max_steps_per_episode: 200
  log_interval: 10
  checkpoint_interval: 100
  early_stop_success_rate: 0.90
  early_stop_window: 100
  seed: 42

paths:
  checkpoint_dir: "checkpoints/hybrid"
  results_dir: "results"
  plots_dir: "results/plots"
  logs_dir: "results/logs"
