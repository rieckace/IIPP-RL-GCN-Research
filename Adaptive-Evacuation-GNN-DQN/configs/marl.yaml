grid:
  rows: 10
  cols: 10

map:
  agent_start:
    - [0, 0]
    - [0, 1]
    - [1, 0]
  exits:
    - [9, 9]
  fire_sources:
    - [5, 5]
  walls:
    - [3, 0]
    - [3, 1]
    - [3, 2]
    - [7, 7]
    - [7, 8]
    - [7, 9]

dynamics:
  fire_spread_probability: 0.05
  smoke_radius: 2
  max_steps: 100

rewards:
  exit_reached: 100.0
  fire_hit: -50.0
  smoke_step: -5.0
  wall_bump: -2.0
  normal_step: -0.5
  stay_penalty: -1.0
  team_bonus: 20.0

agent:
  input_dim: 8
  hidden_dim: 64
  num_actions: 5
  learning_rate: 0.001
  gamma: 0.99
  tau: 0.005

exploration:
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.995

training:
  batch_size: 64
  buffer_size: 20000
